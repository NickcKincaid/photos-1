name: Rename and credit project photos

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'media/**'
      - '!media/_optimized/**'
      - 'scripts/rename_project_photos.py'
      - 'scripts/credit_project_photos.py'
      - 'scripts/optimize_project_photos.py'
      - '.github/workflows/rename-project-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manage-project-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install photo metadata tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Install image optimization library
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Standardize file names and image references
        run: python3 scripts/rename_project_photos.py
      - name: Embed creator and copyright metadata
        run: python3 scripts/credit_project_photos.py
      - name: Generate responsive WebP thumbnails
        run: python3 scripts/optimize_project_photos.py
      - name: Commit updated images and references
        run: |
          git add -A -- content/projects media
          if git diff --cached --quiet; then
            echo 'No photo updates needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rename and credit project photographs'
          git push
