name: Test photography website

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'content/**'
      - 'note_format.py'
      - 'scripts/**'
      - 'photo_exif.py'
      - 'admin-lib/**'
      - 'functions/**'
      - 'static/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/test-website.yml'
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python build and data handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check authenticated API and upload handlers
        run: node --test tests/*.test.mjs
      - name: Verify site generation
        run: python3 build.py
