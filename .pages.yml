# Legacy Pages CMS remains available only for the site title.
# Use https://nickckincaid.com/admin/ to create projects or upload media;
# that private dashboard stores new photographs in Cloudflare R2.
content:
  - name: settings
    label: Site settings
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Website title (top left)
        type: string
        required: true
